<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      html {
        font-family: sans-serif;
        background-color: rgb(192, 192, 192);
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        max-width: 800px;
        margin: 0 auto;
        min-height: 100dvh;
        column-gap: 16px;
      }

      .user-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        row-gap: 8px;
      }

      .user-counter {
        padding: 12px;
        border-radius: 100%;
        background-color: brown;
        color: white;
        min-width: 44px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .user-current-number {
        padding: 12px;
        border-radius: 100%;
        background-color: white;
        color: brown;
        min-width: 55px;
        min-height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .generate-button {
        padding: 10px 15px;
        border-radius: 8px;
        background-color: brown;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <script src="main.js"></script>
  </body>
</html>
